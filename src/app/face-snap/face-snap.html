<div class="face-snap-card" [ngClass]="{snapped: userHasSnapped}">
    <h2>{{snapFace.title | titlecase}}</h2>
    @if (snapFace.location) {
    <p>Localisation: {{ snapFace.location }}</p>
    }@else {
    <p>Localisation non spécifiée</p>
    }
    <img [src]="snapFace.imageUrl" [alt]="snapFace.title">
    <p>{{snapFace.description}}</p>
    <p>Face snap créée le {{snapFace.createAt | date: 'd MMMM yyyy'}}</p>
    <p>
        <button (click)="onClickSnap()">{{ buttonText }}</button>
        <span [ngStyle]="{color: 'rgb(0,' + snapFace.snaps + ',0)'}">
            👍{{snapFace.snaps}}
        </span>
    </p>
</div>
